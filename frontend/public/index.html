<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme & Colors -->
    <meta name="theme-color" content="#0E1015" />
    <meta name="background-color" content="#0E1015" />

    <!-- Apple iOS Safari Mobile Web App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChipMate" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Standard Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preload Splash Video for Instant Seamless Playback -->
    <link rel="preload" href="/splash_video.mp4" as="video" type="video/mp4" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #07090D;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Prevent white focus boxes and override browser autofill backgrounds */
      input, textarea, select {
        outline: none !important;
        -webkit-tap-highlight-color: transparent;
        background-color: transparent !important;
        color: #F8FAFC !important;
      }
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px #12151C inset !important;
        -webkit-text-fill-color: #F8FAFC !important;
        caret-color: #EB5E28 !important;
        transition: background-color 5000s ease-in-out 0s;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('[ChipMate PWA] Service Worker registered:', reg.scope);
              reg.onupdatefound = function() {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function() {
                    if (installingWorker.state === 'installed') {
                      if (navigator.serviceWorker.controller) {
                        console.log('[ChipMate PWA] New update ready for user activation.');
                        window.dispatchEvent(new CustomEvent('chipmate-update-available', {
                          detail: { registration: reg }
                        }));
                      }
                    }
                  };
                }
              };
            })
            .catch(function(err) {
              console.log('[ChipMate PWA] SW registration note:', err);
            });
        });
      }
    </script>
  </body>
</html>

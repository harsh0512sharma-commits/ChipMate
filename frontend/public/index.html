<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme & Colors -->
    <meta name="theme-color" content="#000000" />
    <meta name="background-color" content="#000000" />

    <!-- Apple iOS Safari Mobile Web App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChipMate" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Standard Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preload Splash Video for Instant Seamless Playback -->
    <link rel="preload" href="/splash_video_v2.mp4?v=1.0.22" as="video" type="video/mp4" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #000000;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Completely hide scrollbars everywhere while preserving full scrolling functionality */
      *::-webkit-scrollbar,
      ::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }
      html, body, #root, div, * {
        -ms-overflow-style: none !important; /* IE and Edge */
        scrollbar-width: none !important; /* Firefox */
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Prevent white focus boxes and override browser autofill backgrounds */
      input, textarea, select {
        outline: none !important;
        -webkit-tap-highlight-color: transparent;
        background-color: transparent !important;
        color: var(--cm-text, #F8FAFC) !important;
      }
      input::placeholder, textarea::placeholder {
        color: var(--cm-text-muted, #94A3B8) !important;
        opacity: 0.85 !important;
      }
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px var(--cm-card-inset, #12151C) inset !important;
        -webkit-text-fill-color: var(--cm-text, #F8FAFC) !important;
        caret-color: var(--cm-primary, #2563EB) !important;
        transition: background-color 5000s ease-in-out 0s;
      }
      /* Prevent accidental selection on UI elements while preserving text inputs */
      html, body, #root {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input, textarea {
        -webkit-user-select: text !important;
        user-select: text !important;
      }
    </style>

    <!-- Layer 1 Security: Anti-Inspect and Shortcut Interceptor -->
    <script>
      (function() {
        // Prevent right-click / context menu
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        }, { capture: true });

        // Intercept DevTools shortcuts
        window.addEventListener('keydown', function(e) {
          // F12
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }

          var isModifier = e.ctrlKey || e.metaKey;
          var key = (e.key || '').toLowerCase();
          var code = e.keyCode;

          // Ctrl+Shift+I / Cmd+Opt+I (DevTools Inspect)
          // Ctrl+Shift+J / Cmd+Opt+J (Console)
          // Ctrl+Shift+C / Cmd+Opt+C (Element Inspector)
          if (isModifier && e.shiftKey && (key === 'i' || key === 'j' || key === 'c' || code === 73 || code === 74 || code === 67)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }

          // Ctrl+U / Cmd+Opt+U (View Source)
          if (isModifier && (key === 'u' || code === 85)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }

          // Ctrl+S / Cmd+S (Save Page)
          if (isModifier && (key === 's' || code === 83)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, { capture: true });

        try {
          console.log(
            '%cChipMate Security Notice%c\nClient-side inspection is disabled for game ledger integrity.',
            'color: #3b82f6; font-size: 16px; font-weight: bold;',
            'color: #94a3b8; font-size: 12px;'
          );
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js?v=1.0.30')
            .then(function(reg) {
              console.log('[ChipMate PWA] Service Worker registered:', reg.scope);
              
              // Force background check for sw update
              try { reg.update(); } catch (_) {}

              // Re-check for sw update when user returns to app
              document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                  try { reg.update(); } catch (_) {}
                }
              });

              reg.onupdatefound = function() {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function() {
                    if (installingWorker.state === 'installed') {
                      if (navigator.serviceWorker.controller) {
                        console.log('[ChipMate PWA] New update ready for user activation.');
                        window.dispatchEvent(new CustomEvent('chipmate-update-available', {
                          detail: { registration: reg }
                        }));
                      }
                    }
                  };
                }
              };
            })
            .catch(function(err) {
              console.log('[ChipMate PWA] SW registration note:', err);
            });
        });
      }
    </script>
  </body>
</html>
